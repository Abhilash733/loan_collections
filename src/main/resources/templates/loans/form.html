<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Create loan')}"></head><body>
<header th:replace="~{fragments/layout :: topbar('loans')}"></header>
<main class="container narrow"><section class="welcome"><div><p class="eyebrow">NEW RECORD</p><h1>Create a loan</h1><p class="muted">Enter the loan details below. The account must already exist.</p></div></section>
<div class="alert error" th:if="${formError}" th:text="${formError}"></div><section class="panel form-panel"><form th:action="@{/loans/create}" th:object="${loanForm}" method="post">
<div class="form-grid"><div class="field"><label for="accountId">Existing account ID</label><input id="accountId" type="number" min="1" th:field="*{accountId}" placeholder="e.g. 1" required><small>Use an ID from the accounts table.</small><p class="field-error" th:if="${#fields.hasErrors('accountId')}" th:errors="*{accountId}"></p></div>
<div class="field"><label for="principalAmount">Principal amount (₹)</label><input id="principalAmount" type="number" min="0.01" step="0.01" th:field="*{principalAmount}" placeholder="150000.00" required><p class="field-error" th:if="${#fields.hasErrors('principalAmount')}" th:errors="*{principalAmount}"></p></div>
<div class="field"><label for="annualInterestRate">Annual interest rate (%)</label><input id="annualInterestRate" type="number" min="0" step="0.0001" th:field="*{annualInterestRate}" placeholder="12.5" required><p class="field-error" th:if="${#fields.hasErrors('annualInterestRate')}" th:errors="*{annualInterestRate}"></p></div>
<div class="field"><label for="termMonths">Loan term (months)</label><input id="termMonths" type="number" min="1" th:field="*{termMonths}" placeholder="36" required><p class="field-error" th:if="${#fields.hasErrors('termMonths')}" th:errors="*{termMonths}"></p></div>
<div class="field full"><label for="startDate">Start date</label><input id="startDate" type="date" th:field="*{startDate}" required><p class="field-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></p></div></div>
<div class="form-actions"><a class="button secondary" th:href="@{/loans}">Cancel</a><button class="button primary" type="submit">Create loan</button></div></form></section><p class="footnote">For API testing, the matching endpoint is <code>POST /api/v1/loans</code> with Basic Auth.</p></main></body></html>
