<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Loans')}"></head><body>
<header th:replace="~{fragments/layout :: topbar('loans')}"></header>
<main class="container"><section class="welcome"><div><p class="eyebrow">PORTFOLIO</p><h1>Loans</h1><p class="muted">Browse existing loans and create a new loan record.</p></div><a class="button primary" th:href="@{/loans/new}">＋ Create loan</a></section>
<div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Loan reference</th><th>Account ID</th><th>Principal amount</th><th>Annual rate</th><th>Term</th><th>Start date</th><th>Status</th></tr></thead><tbody><tr th:each="loan : ${loans}"><td class="mono" th:text="${loan.loanRef()}"></td><td th:text="${loan.accountId()}"></td><td th:text="${#numbers.formatDecimal(loan.principalAmount(),1,'COMMA',2,'POINT')}"></td><td th:text="${loan.annualInterestRate()} + '%'"></td><td th:text="${loan.termMonths()} + ' months'"></td><td th:text="${loan.startDate()}"></td><td><span class="pill" th:text="${loan.status()}"></span></td></tr><tr th:if="${#lists.isEmpty(loans)}"><td colspan="7" class="empty">No loans yet. Add an account in MySQL first, then create a loan.</td></tr></tbody></table></div></section><p class="footnote">A loan must reference an existing account ID in the database.</p></main></body></html>
