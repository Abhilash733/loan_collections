# Local, git-ignored overrides (DB_URL, DB_USERNAME, DB_PASSWORD, SERVER_PORT). See .env.example.
spring.config.import=optional:file:.env[.properties]

spring.thymeleaf.cache=false
spring.application.name=loan-collections

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loan_collections?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:loan_app}
spring.datasource.password=${DB_PASSWORD:local-dev-password-change-me}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.flyway.enabled=true

server.port=6969

# Generated dataset (seed SQL, ground truth, manifest) produced by tools/generate_synthetic_data.py
app.dataset-dir=${DATASET_DIR:data/generated}

logging.level.com.example.loancollections=INFO